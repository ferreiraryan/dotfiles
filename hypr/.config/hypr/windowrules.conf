windownrule = opacity 0.80 $& 0.70 $& 1,class:^(org.freedesktop.impl.portal.desktop.hyprland)$
windownrule = opacity 0.70 $& 0.70 $& 1,class:^([Ss]team)$
windownrule = opacity 0.70 $& 0.70 $& 1,class:^(steamwebhelper)$
windownrule = opacity 0.8 $& 0.9 $& 1,class:^([Ss]potify)$
windownrule = opacity 0.70 $& 0.70 $& 1, match:initial_title ^(Spotify Free)$
windownrule = opacity 0.95 $& 0.8 $& 1, match:initial_title ^(Spotify Premium)$

windownrule = opacity 0.90 0.90,class:^(com.github.rafostar.Clapper)$ # Clapper-Gtk
windownrule = opacity 0.80 0.80,class:^(com.github.tchx84.Flatseal)$ # Flatseal-Gtk
