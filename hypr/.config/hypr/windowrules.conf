windownrule = opacity 0.80 0.80,class:^(net.davidotek.pupgui2)$ # ProtonUp-Qt
windownrule = opacity 0.80 0.80,class:^(yad)$ # Protontricks-Gtk
windownrule = opacity 0.80 0.80,class:^(Signal)$ # Signal-Gtk
windownrule = opacity 0.80 0.80,class:^(io.github.alainm23.planify)$ # planify-Gtk
