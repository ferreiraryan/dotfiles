# See https://wiki.hyprland.org/Configuring/Window-Rules/

# '$&' is a hyde specific shorthand for "override" \\ analogous to a reference
# This symbol indicates that the following values will override the default configuration
$&=override

windownrule = opacity 1 $& 0.95 $& 1,class:^(firefox)$
windownrule = opacity 0.90 $& 0.90 $& 1,class:^(Brave-browser)$
windownrule = opacity 0.95 $& 0.90 $& 1,class:^(code)$
windownrule = opacity 0.80 $& 0.80 $& 1,class:^(code-url-handler)$
windownrule = opacity 0.80 $& 0.80 $& 1,class:^(code-insiders-url-handler)$
windownrule = opacity 0.95 $& 0.85 $& 1,class:^(kitty)$
windownrule = opacity 0.80 $& 0.80 $& 1,class:^(org.kde.dolphin)$
windownrule = opacity 0.80 $& 0.80 $& 1,class:^(org.kde.ark)$
windownrule = opacity 0.80 $& 0.80 $& 1,class:^(nwg-look)$
windownrule = opacity 0.80 $& 0.80 $& 1,class:^(qt5ct)$
windownrule = opacity 0.80 $& 0.80 $& 1,class:^(qt6ct)$
windownrule = opacity 0.80 $& 0.80 $& 1,class:^(kvantummanager)$
windownrule = opacity 0.80 $& 0.70 $& 1,class:^(org.pulseaudio.pavucontrol)$
windownrule = opacity 0.80 $& 0.70 $& 1,class:^(blueman-manager)$
windownrule = opacity 0.80 $& 0.70 $& 1,class:^(nm-applet)$
windownrule = opacity 0.80 $& 0.70 $& 1,class:^(nm-connection-editor)$
windownrule = opacity 0.80 $& 0.70 $& 1,class:^(org.kde.polkit-kde-authentication-agent-1)$
