windownrule = opacity 0.80 0.80,class:^(gnome-boxes)$ # Boxes-Gtk
windownrule = opacity 0.80 0.80,class:^(vesktop)$ # Vesktop
windownrule = opacity 0.9 0.80,class:^(discord)$ # Discord-Electron
windownrule = opacity 0.80 0.80,class:^(WebCord)$ # WebCord-Electron
windownrule = opacity 0.80 0.80,class:^(ArmCord)$ # ArmCord-Electron
